services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxify_app
    env_file:
      - path: .env
        required: false
    environment:
      - APP_NAME=${APP_NAME:-Voxify}
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
